
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的花園世界｜花靈計算器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f5fa;color:#40394a;font-family:Arial,"Noto Sans TC",sans-serif}
header{background:#9575b8;color:white;padding:25px 18px;text-align:center}
header h1{margin:0;font-size:24px}
header p{font-size:13px;margin:8px 0 0}
main{max-width:760px;margin:auto;padding:16px}
section{background:white;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 2px 9px #0000000b}
h2{font-size:18px;margin:0 0 14px;color:#79569b}
h3{font-size:15px;margin:8px 0;color:#79569b}
label{display:block;font-size:13px;margin:10px 0 5px}
input,select{width:100%;padding:11px;border:1px solid #ddd2e8;border-radius:9px;font-size:15px;background:white;color:#40394a}
button{border:0;border-radius:9px;padding:11px 15px;background:#9575b8;color:white;font-size:14px;cursor:pointer;margin-top:10px}
.secondary{background:#eee7f4;color:#674a82}
.danger{background:#f5e5e5;color:#9c4444}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:grid;grid-template-columns:42px 1fr 42px;gap:6px;align-items:center}
.stepper button{margin:0;padding:10px 0;font-size:20px}
.stepper input{text-align:center}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#f5eff9;padding:12px;border-radius:10px;text-align:center}
.stat strong{display:block;font-size:22px;color:#79569b;margin-top:5px}
.summary-line{font-size:14px;line-height:1.9;color:#5b4a68;margin-top:12px}
.summary-line strong{color:#79569b}
.summary-boxes{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.summary-box{background:#f5eff9;padding:13px 10px;border-radius:10px;text-align:center;color:#79569b;font-weight:bold;line-height:1.6}
.summary-box strong{display:block;font-size:21px;margin-top:4px}
.small{font-size:12px;color:#877e8f;line-height:1.7}
.result{font-size:16px;font-weight:bold;margin-top:12px;color:#79569b;line-height:1.7}
.color-card{background:#faf8fc;border:1px solid #eee5f4;border-radius:10px;padding:10px}
.color-card label{margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
td,th{padding:9px 5px;border-bottom:1px solid #eee;text-align:left}
th{color:#79569b}
footer{text-align:center;color:#999;font-size:12px;padding:20px}
@media(max-width:480px){.row{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}table{font-size:12px}}
</style>
</head>
<body>
<header>
<h1>🌸 我的花園世界</h1>
<p>花靈收藏・寶寶倉庫・目標計算器</p>
</header>
<main>
<section>
<h2>🌷 商店收藏目標</h2>
<div class="row">
<div><label>9999 幣花朵數量</label><div class="stepper"><button type="button" class="secondary" onclick="changeGoal('goal9999',-1)">−</button><input id="goal9999" type="number" min="0" max="1" step="1" value="1"><button type="button" class="secondary" onclick="changeGoal('goal9999',1)">＋</button></div></div>
<div><label>5999 幣花朵數量</label><div class="stepper"><button type="button" class="secondary" onclick="changeGoal('goal5999',-1)">−</button><input id="goal5999" type="number" min="0" max="1" step="1" value="1"><button type="button" class="secondary" onclick="changeGoal('goal5999',1)">＋</button></div></div>
<div><label>3999 幣花朵數量</label><div class="stepper"><button type="button" class="secondary" onclick="changeGoal('goal3999',-1)">−</button><input id="goal3999" type="number" min="0" max="3" step="1" value="3"><button type="button" class="secondary" onclick="changeGoal('goal3999',1)">＋</button></div></div>
<div><label>999 幣花瓶數量</label><div class="stepper"><button type="button" class="secondary" onclick="changeGoal('goalVase999',-1)">−</button><input id="goalVase999" type="number" min="0" max="1" step="1" value="1"><button type="button" class="secondary" onclick="changeGoal('goalVase999',1)">＋</button></div></div>
<div><label>其他收藏目標幣值（自行輸入）</label><input id="otherGoal" type="number" min="0" step="1" value="0"></div>
</div>
<div class="result" id="goalResult"></div>
<label>目前已有幣值</label><input id="currentCoins" type="number" min="0" value="0">
<label>距離商店刷新還有幾天</label><input id="shopDays" type="number" min="0" value="180">
<div class="result" id="remainingResult"></div>
</section>

<section>
<h2>🧺 我的寶寶倉庫</h2>
<div class="three">
<div class="color-card">
<strong>🟡 金色</strong>
<label>雙倍數量</label><input id="goldDouble" type="number" min="0" step="1" value="0">
<label>過期寶寶數量</label><input id="goldExpired" type="number" min="0" step="1" value="0">
</div>
<div class="color-card">
<strong>🟣 紫色</strong>
<label>雙倍數量</label><input id="purpleDouble" type="number" min="0" step="1" value="0">
<label>過期寶寶數量</label><input id="purpleExpired" type="number" min="0" step="1" value="0">
</div>
<div class="color-card">
<strong>🔵 藍色</strong>
<label>雙倍數量</label><input id="blueDouble" type="number" min="0" step="1" value="0">
<label>過期寶寶數量</label><input id="blueExpired" type="number" min="0" step="1" value="0">
</div>
</div>
<button class="danger" onclick="clearInventory()">清除寶寶庫存</button>
<div id="inventorySummary"></div>
<div class="summary-line" id="inventoryStats"></div>
<div class="summary-boxes">
<div class="summary-box">目前全部寶寶<strong id="allCount">0 隻</strong></div>
<div class="summary-box">全部派遣預估收益<strong id="allTotal">0 幣</strong></div>
</div>
</section>

<section>
<h2>🐣 每日刷寶寶設定</h2>
<label>花靈購買狀態</label>
<select id="flowerStatus">
<option value="0">沒有購買花靈</option>
<option value="18">已購買花靈（18 隻／日）</option>
<option value="30">花靈＋密令（30 隻／日）</option>
</select>
<div class="stat">每日可刷<strong id="dailyCount">0</strong></div>
</section>

<section>
<h2>🔮 未來抓取寶寶收益預估</h2>
<label>目前花靈活動第幾週</label>
<select id="activityWeek">
<option value="1">第 1 週</option><option value="2">第 2 週</option><option value="3">第 3 週</option><option value="4">第 4 週</option>
</select>
<label>預估情境</label>
<select id="forecastMode">
<option value="double">全部抓雙倍寶寶</option>
<option value="expired">全部抓過期寶寶</option>
</select>
<p class="small">目前寶寶倉庫的所有寶寶收益會自動計入預估，修改庫存或收藏目標時會即時更新。</p>
<div class="summary-line" id="forecastStats"></div>
<div class="summary-boxes">
<div class="summary-box">距離收藏目標<strong id="forecastGap">0 幣</strong></div>
<div class="summary-box">預估結果<strong id="forecastResult">尚未計算</strong></div>
</div>
</section>

<section>
<h2>💾 資料備份</h2>
<button class="secondary" onclick="exportData()">匯出備份</button>
<button class="secondary" onclick="$('importFile').click()">匯入備份</button>
<input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)">
<button class="danger" onclick="resetData()">清除所有資料</button>
</section>
</main>
<footer>我的花園世界 🌸 第九版・版面調整</footer>
<script>
const $=id=>document.getElementById(id);
function goalMax(id){return id==="goal9999"||id==="goal5999"||id==="goalVase999"?1:id==="goal3999"?3:Infinity;}
function clampGoal(id){$(id).value=Math.min(goalMax(id),Math.max(0,Math.floor(Number($(id).value)||0)));}
function changeGoal(id,delta){$(id).value=Math.min(goalMax(id),Math.max(0,Math.floor(Number($(id).value)||0)+delta));goals();save();}
const colors={gold:{name:"金色",base:4},purple:{name:"紫色",base:3},blue:{name:"藍色",base:2}};
let inventory={gold:{double:0,expired:0},purple:{double:0,expired:0},blue:{double:0,expired:0}};
let dailyCatchDate="",dailyCatchCount=0;

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function refreshCatchDay(){if(dailyCatchDate!==today()){dailyCatchDate=today();dailyCatchCount=0}}
function num(id){return Math.max(0,Math.floor(Number($(id).value)||0))}
function save(){
 const ids=["goal9999","goal5999","goal3999","goalVase999","otherGoal","currentCoins","shopDays","flowerStatus","activityWeek","forecastMode"];
 const values={};ids.forEach(id=>values[id]=$(id).value);
 localStorage.setItem("gardenPlannerV5",JSON.stringify({values,inventory,dailyCatchDate,dailyCatchCount}));
}
function legacyInventory(batches){
 const out={gold:{double:0,expired:0},purple:{double:0,expired:0},blue:{double:0,expired:0}};
 (batches||[]).forEach(b=>{
  if(!out[b.color])return;
  const q=Math.max(0,Number(b.qty)||0);
  if(b.dbl)out[b.color].double+=q;else out[b.color].expired+=q;
 });
 return out;
}
function load(){
 let d=JSON.parse(localStorage.getItem("gardenPlannerV5")||"null");
 if(d){
  Object.keys(d.values||{}).forEach(id=>{if($(id) && true)$(id).value=d.values[id]});
  if(d.inventory)inventory=normalizeInventory(d.inventory);
  dailyCatchDate=d.dailyCatchDate||today();dailyCatchCount=Number(d.dailyCatchCount)||0;
 }else{
  let old=JSON.parse(localStorage.getItem("gardenPlannerV4")||"null");
  if(!old)old=JSON.parse(localStorage.getItem("gardenPlannerV3")||"null");
  if(old){
   Object.keys(old.values||{}).forEach(id=>{if($(id))$(id).value=old.values[id]});
   inventory=legacyInventory([...(old.selfBatches||old.batches||[]),...(old.caughtBatches||[])]);
   dailyCatchDate=old.dailyCatchDate||today();dailyCatchCount=Number(old.dailyCatchCount)||0;
  }else{
   let prev=JSON.parse(localStorage.getItem("gardenPlannerV2")||"null");
   if(prev){Object.keys(prev.values||{}).forEach(id=>{if($(id))$(id).value=prev.values[id]});inventory=legacyInventory(prev.batches||[])}
   else{
    let first=JSON.parse(localStorage.getItem("gardenPlanner")||"null");
    if(first?.values)Object.keys(first.values).forEach(id=>{if($(id))$(id).value=first.values[id]});
    const babies=JSON.parse(localStorage.getItem("gardenBabies")||"[]");
    inventory=legacyInventory(babies.map(b=>({color:b.color,qty:b.qty,dbl:b.dbl})));
   }
   dailyCatchDate=today();dailyCatchCount=0;
  }
 }
 refreshCatchDay();writeInputs();render();
}
function normalizeInventory(data){
 const out={gold:{double:0,expired:0},purple:{double:0,expired:0},blue:{double:0,expired:0}};
 Object.keys(colors).forEach(c=>{const x=data[c]||{};out[c].double=Number(x.double)||0;out[c].expired=(Number(x.expired)||0)+(Number(x.normal)||0)});
 return out;
}
function writeInputs(){
 Object.keys(colors).forEach(c=>{
  $(c+"Double").value=inventory[c]?.double||0;
  $(c+"Expired").value=inventory[c]?.expired||0;
 });
}
function clearInventory(){
 if(!confirm("確定清除所有寶寶庫存？不會影響目前幣值及收藏目標。"))return;
 inventory={gold:{double:0,expired:0},purple:{double:0,expired:0},blue:{double:0,expired:0}};
 Object.keys(colors).forEach(c=>{$(c+"Double").value=0;$(c+"Expired").value=0});
 render();save();
}
function goals(){
 ["goal9999","goal5999","goal3999","goalVase999"].forEach(clampGoal);
 const total=num("goal9999")*9999+num("goal5999")*5999+num("goal3999")*3999+num("goalVase999")*999+num("otherGoal");
 const current=num("currentCoins"),left=Math.max(0,total-current),days=num("shopDays");
 $("goalResult").textContent="目標總幣值："+total.toLocaleString()+" 幣";
 $("remainingResult").textContent="還差 "+left.toLocaleString()+" 幣；每天平均需要 "+(days>0?(left/days).toFixed(1):"—")+" 幣";
}
function daily(){
 // 刷寶寶數量由購買狀態固定決定：未購買 0、花靈 18、花靈＋密令 30
 const status=Number($("flowerStatus").value);
 $("dailyCount").textContent=status;
}
function render(){
 let rows="<table><tr><th>顏色</th><th>雙倍</th><th>過期寶寶</th><th>預估收益</th></tr>";
 let count=0,active=0,expired=0;
 Object.keys(colors).forEach(c=>{
  const x=inventory[c]||{double:0,expired:0},base=colors[c].base;
  const subtotal=x.double*base*2+x.expired*base;
  count+=x.double+x.expired;active+=x.double*base*2;expired+=x.expired*base;
  rows+=`<tr><td>${colors[c].name}</td><td>${x.double}</td><td>${x.expired}</td><td>${subtotal.toLocaleString()} 幣</td></tr>`;
 });
 rows+="</table>";$("inventorySummary").innerHTML=rows;
 $("allCount").textContent=count.toLocaleString()+" 隻";
 $("allTotal").textContent=(active+expired).toLocaleString()+" 幣";
 $("inventoryStats").innerHTML="寶寶總數：<strong>"+count.toLocaleString()+" 隻</strong>｜雙倍收益：<strong>"+active.toLocaleString()+" 幣</strong>｜過期收益：<strong>"+expired.toLocaleString()+" 幣</strong>";
 daily();goals();forecast();
}
function forecast(){
 const days=num("shopDays"),count=days*4,mode=$("forecastMode").value;
 let week=Number($("activityWeek").value)||1;
 const d=new Date();d.setHours(12,0,0,0);
 let futureCoins=0,weekRows={1:0,2:0,3:0,4:0};
 for(let i=1;i<=days;i++){
  d.setDate(d.getDate()+1);
  if(d.getDay()===1)week=week%4+1;
  const perBaby=mode==="expired"?4:(week<=2?8:6);
  const earned=4*perBaby;futureCoins+=earned;weekRows[week]+=earned;
 }
 let inventoryCoins=0;
 Object.keys(colors).forEach(c=>{
  const x=inventory[c]||{double:0,expired:0};
  inventoryCoins+=x.double*colors[c].base*2+x.expired*colors[c].base;
 });
 const current=num("currentCoins"),goal=num("goal9999")*9999+num("goal5999")*5999+num("goal3999")*3999+num("goalVase999")*999+num("otherGoal");
 const total=current+futureCoins+inventoryCoins,left=Math.max(0,goal-total);
 $("forecastStats").innerHTML="未來可抓數量：<strong>"+count.toLocaleString()+" 隻</strong>｜未來預估收益：<strong>"+futureCoins.toLocaleString()+" 幣</strong>｜預估總幣值：<strong>"+total.toLocaleString()+" 幣</strong>";
 $("forecastGap").textContent=left.toLocaleString()+" 幣";
 $("forecastResult").textContent=left===0?"恭喜！可達成":"不可達成，再加油！！";
}
function exportData(){
 save();const data=localStorage.getItem("gardenPlannerV5");
 const blob=new Blob([data],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="我的花園世界備份.json";a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
 const file=e.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{try{
  const d=JSON.parse(reader.result);if(!d.values)throw new Error();
  Object.keys(d.values).forEach(id=>{if($(id) && true)$(id).value=d.values[id]});
  if(d.inventory)inventory=normalizeInventory(d.inventory);
  else inventory=legacyInventory([...(d.selfBatches||d.batches||[]),...(d.caughtBatches||[])]);
  dailyCatchDate=d.dailyCatchDate||today();dailyCatchCount=Number(d.dailyCatchCount)||0;
  refreshCatchDay();writeInputs();render();save();alert("匯入成功！");
 }catch(err){alert("檔案格式不正確，無法匯入。")}};
 reader.readAsText(file);e.target.value="";
}
function resetData(){
 if(!confirm("確定清除所有資料？此操作無法復原。"))return;
 ["gardenPlannerV5","gardenPlannerV4","gardenPlannerV3","gardenPlannerV2","gardenPlanner","gardenBabies"].forEach(k=>localStorage.removeItem(k));
 location.reload();
}
["goal9999","goal5999","goal3999","goalVase999","otherGoal","currentCoins","shopDays"].forEach(id=>$(id).addEventListener("input",()=>{goals();save()}));
$("flowerStatus").addEventListener("change",()=>{daily();save()});
["goldDouble","goldExpired","purpleDouble","purpleExpired","blueDouble","blueExpired"]
.forEach(id=>$(id).addEventListener("input",()=>{
 const next={};
 Object.keys(colors).forEach(c=>{
  next[c]={double:num(c+"Double"),expired:num(c+"Expired")};
 });
 inventory=next;
 render();
 save();
}));
["shopDays","currentCoins","goal9999","goal5999","goal3999","goalVase999","otherGoal","activityWeek","forecastMode"].forEach(id=>$(id).addEventListener("change",()=>{forecast();save()}));
["shopDays","currentCoins","goal9999","goal5999","goal3999","otherGoal"].forEach(id=>$(id).addEventListener("input",forecast));
load();
</script>
</body>
</html>
